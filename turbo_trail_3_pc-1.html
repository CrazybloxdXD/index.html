<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Turbo Trail 3: Nitro Quest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10172f;font-family:system-ui,Arial,sans-serif;touch-action:none}#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block;object-fit:contain;max-width:100vw;max-height:100vh}.hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;font-weight:1000;font-size:clamp(12px,3vw,22px);text-shadow:0 3px 0 #10172f,2px 0 #10172f,-2px 0 #10172f;pointer-events:none}.hud .mid{text-align:center}.hud small{display:block;font-size:.6em;letter-spacing:1px}.hud button{pointer-events:auto}.topbtn{border:2px solid #d8f5ff;background:linear-gradient(#34bfff,#1761d8);color:white;border-radius:11px;font-weight:950;padding:7px 10px;box-shadow:0 4px #0d2d76}#hint{position:absolute;top:61px;left:0;right:0;text-align:center;color:#fff;font-size:12px;font-weight:800;text-shadow:0 2px 4px #001;pointer-events:none}.controls{position:absolute;bottom:12px;left:13px;right:13px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.group{display:flex;gap:8px}.ctrl{pointer-events:auto;width:clamp(53px,12vw,78px);height:clamp(53px,12vw,78px);border:3px solid #eafaff;border-radius:22px;background:linear-gradient(145deg,rgba(35,65,110,.92),rgba(8,19,48,.92));color:#fff;font-size:clamp(23px,5.5vw,38px);font-weight:1000;display:grid;place-items:center;box-shadow:0 5px 0 #080f28;user-select:none}.ctrl:active{transform:translateY(3px);box-shadow:0 2px #080f28}.ctrl.shoot{background:linear-gradient(#ff8d35,#dc252e);border-radius:50%;font-size:clamp(18px,4vw,27px);display:none}.ctrl.shoot.visible{display:grid}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,28,.72);padding:12px;overflow:auto}.hidden{display:none!important}.panel{max-width:490px;width:100%;max-height:94%;overflow:auto;text-align:center;color:#fff;background:linear-gradient(155deg,#3923a3,#087bbd 65%,#16b9b4);border:3px solid #bdf5ff;border-radius:24px;padding:19px 16px;box-shadow:0 0 0 5px #111a45,0 10px #050b20}.panel h1{font-size:clamp(26px,7vw,42px);margin:0 0 6px;text-shadow:0 4px #111a45}.panel p{line-height:1.4;margin:8px 0 14px}.action{border:2px solid #fff;border-radius:13px;background:linear-gradient(#ffe76a,#ffad20);color:#462700;font-weight:1000;font-size:17px;padding:10px 16px;box-shadow:0 4px #9c4c08;margin:4px}.secondary{background:linear-gradient(#f4fcff,#b6eaff);color:#14365e;box-shadow:0 4px #407a9d}.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.carcard{background:rgba(4,20,65,.48);border:2px solid rgba(255,255,255,.55);border-radius:13px;padding:9px 5px}.carpreview{font-size:35px;line-height:1.3}.carcard strong{display:block}.carcard small{display:block;opacity:.95;margin:3px}.carcard button{font-size:12px;padding:7px 9px;margin-top:4px}.levels{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}.levels span{background:rgba(255,255,255,.2);padding:6px 9px;border-radius:8px;font-size:12px}
@media (hover:hover) and (pointer:fine){.controls{display:none!important}#hint{top:auto;bottom:14px;left:50%;right:auto;transform:translateX(-50%);width:max-content;max-width:90%;padding:7px 12px;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(5,12,35,.72);font-size:13px}.hud{font-size:20px}}@media (max-width:700px){.hud{top:7px}.topbtn{padding:6px 8px}.panel{padding:15px 12px}}</style></head><body><div id="wrap"><canvas id="game" width="960" height="540"></canvas><div class="hud"><div>🪙 <span id="coinhud">0</span><small>❤️ <span id="lives">3</span> LIVES</small></div><div class="mid"><small id="stage">LEVEL 1 / 10</small><span id="score">000000</span></div><div><button class="topbtn" id="shopbtn">GARAGE</button> <button class="topbtn" id="pause">Ⅱ</button></div></div><div id="hint">PHONE: ◀ ▶ DRIVE · ⬆ JUMP · ⚡ NITRO · FIRE  |  PC: A/D OR ←/→ DRIVE · SPACE JUMP · SHIFT NITRO · Z FIRE</div><div class="controls"><div class="group"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="group"><button class="ctrl" data-key="nitro">⚡</button><button class="ctrl" data-key="jump">⬆</button><button class="ctrl shoot" id="shoot" data-key="shoot">● FIRE</button></div></div><div id="overlay"><div class="panel" id="panel"></div></div></div><script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=540,$=id=>document.getElementById(id),overlay=$('overlay'),panel=$('panel');const N=10,cars=[{name:'Starter',emoji:'🚗',color:'#f74738',price:0,speed:5.2,nitro:1},{name:'Blue Bolt',emoji:'🏎️',color:'#268bff',price:35,speed:5.8,nitro:1.1},{name:'Golden GT',emoji:'🚕',color:'#ffc629',price:70,speed:6.1,nitro:1.15},{name:'Neon Racer',emoji:'🚙',color:'#c45cff',price:120,speed:6.4,nitro:1.25},{name:'Monster Truck',emoji:'🛻',color:'#39d76b',price:180,speed:5.7,nitro:1.6}];let save={coins:0,owned:[0],selected:0,unlocked:1};try{let s=JSON.parse(localStorage.getItem('turboTrailSaveV3'));if(s)save={...save,...s}}catch(e){}let keys={left:false,right:false,jump:false,nitro:false,shoot:false},scene='home',paused=false,cam=0,frame=0,score=0,runCoins=0,level=1,lives=3,nitroTime=0,nitroUsed=false,freeNitro=false,car={x:60,y:350,vx:0,vy:0,w:66,h:38,onGround:false,invuln:0},worldEnd=2400,plats=[],pits=[],coinList=[],enemies=[],ramps=[],keyItem=null,door=null,miniboss=null,boss=null,gunDrop=null,hasGun=false,bullets=[];
function persist(){try{localStorage.setItem('turboTrailSaveV3',JSON.stringify(save))}catch(e){}}function hud(){$('coinhud').textContent=save.coins;$('score').textContent=String(score).padStart(6,'0');$('stage').textContent=`LEVEL ${level} / ${N}`;$('lives').textContent='♥'.repeat(Math.max(0,lives))||'0';$('shoot').classList.toggle('visible',hasGun)}function showHome(){scene='home';overlay.classList.remove('hidden');panel.innerHTML=`<h1>🏁 TURBO TRAIL 3</h1><p><b>NITRO QUEST</b><br>10 levels · ramps · keys · mini-bosses · boss battles · a real blaster!</p><div class="levels">${Array.from({length:10},(_,i)=>`<span>${i+1<=save.unlocked?'🔓':'🔒'} Level ${i+1}</span>`).join('')}</div><p>Wallet: 🪙 <b>${save.coins}</b></p><button class="action" id="play">PLAY LEVEL ${Math.min(save.unlocked,10)}</button><button class="action secondary" id="garage">🚘 GARAGE / SHOP</button><p style="font-size:12px">Progress is saved in this browser.<br><b>PC:</b> A/D or ←/→ drive · SPACE jump · SHIFT nitro · Z shoot<br><b>Phone:</b> use the on-screen buttons.</p>`;$('play').onclick=()=>startLevel(Math.min(save.unlocked,10));$('garage').onclick=showShop}function showShop(){scene='shop';overlay.classList.remove('hidden');panel.innerHTML=`<h1>🚘 CAR GARAGE</h1><p>Wallet: 🪙 <b>${save.coins}</b></p><div class="shopgrid">${cars.map((c,i)=>`<div class="carcard"><div class="carpreview">${c.emoji}</div><strong>${c.name}</strong><small>Speed ${c.speed.toFixed(1)} · Nitro x${c.nitro}</small><small>${save.owned.includes(i)?(save.selected===i?'✅ Selected':'✅ Owned'):'🪙 '+c.price}</small><button class="action ${save.owned.includes(i)?'secondary':''}" data-car="${i}">${save.owned.includes(i)?(save.selected===i?'SELECTED':'SELECT'):'BUY'}</button></div>`).join('')}</div><button class="action secondary" id="back">← BACK</button>`;panel.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>{let i=+b.dataset.car,c=cars[i];if(save.owned.includes(i)){save.selected=i;persist();showShop()}else if(save.coins>=c.price){save.coins-=c.price;save.owned.push(i);save.selected=i;persist();showShop()}else b.textContent='NEED MORE COINS'});$('back').onclick=showHome;hud()}
function startLevel(n){level=n;scene='game';paused=false;cam=0;frame=0;score=0;runCoins=0;lives=3;nitroTime=0;nitroUsed=false;freeNitro=false;hasGun=false;bullets=[];car={x:60,y:350,vx:0,vy:0,w:66,h:38,onGround:false,invuln:0};worldEnd=2050+n*230;plats=[];pits=[];coinList=[];enemies=[];ramps=[];boss=null;miniboss=null;keyItem=null;door=null;gunDrop=null;
// Carefully spaced platforms and visible gaps. One key gate puzzle per level.
let x=0;while(x<worldEnd-430){let width=280+(Math.floor(x/350)%3)*28,y=405-(Math.floor(x/240)%3)*14;plats.push({x,y,w:width});if(x>0)pits.push({x:x-64,w:64});x+=width+64;}
plats.push({x:worldEnd-260,y:405,w:360});worldEnd+=100;
// Ramps are physical slopes the car can drive up.
for(let i=0;i<Math.min(3,1+Math.floor(level/3));i++){let rx=330+i*430+(level%2)*45;ramps.push({x:rx,y:plats.find(p=>rx>=p.x&&rx<p.x+p.w)?.y||405,w:105,h:58})}
for(let p of plats){for(let cx=p.x+75;cx<p.x+p.w-25;cx+=105){if((Math.floor(cx/105)+level)%3!==1)coinList.push({x:cx,y:p.y-52-(Math.floor(cx/105)%2)*22,taken:false})}}
for(let i=0;i<Math.min(3+Math.floor(level/2),7);i++){let ex=360+i*(worldEnd-900)/Math.max(1,Math.min(3+Math.floor(level/2),7));enemies.push({x:ex,y:370,dir:i%2?1:-1,min:ex-48,max:ex+48,alive:true,hp:1})}
// Key and locked gate sit before arena. A mini-boss guards the key.
let puzzleX=worldEnd-520;miniboss={x:puzzleX-155,y:350,min:puzzleX-205,max:puzzleX-105,hp:level>=6?4:3,maxHp:level>=6?4:3,alive:true,hitCooldown:0,dir:-1};keyItem={x:puzzleX+12,y:350,taken:false};door={x:worldEnd-300,open:false};gunDrop=null;
if(level===10){boss={x:worldEnd-175,y:330,hp:10,maxHp:10,dir:-1,hitCooldown:0};freeNitro=true;overlay.classList.remove('hidden');panel.innerHTML=`<h1>⚡ FINAL BOSS LOADOUT</h1><p>You get free nitro and a blaster for the final monster-car fight. Defeat the guard, grab the key, collect the dropped blaster, then fire at the monster car!</p><div class="carpreview">🔑 🔫 🚗💨 VS 👹🚛</div><button class="action" id="bossgo">START FINAL LEVEL!</button>`;$('bossgo').onclick=()=>{overlay.classList.add('hidden');scene='game'}}else overlay.classList.add('hidden');$('hint').textContent='PHONE: use buttons · PC: A/D or ←/→ drive · SPACE jump · SHIFT nitro · Z shoot · defeat guard → key → gate';hud()}
function rr(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function polygon(points,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let p of points.slice(1))ctx.lineTo(p[0],p[1]);ctx.closePath();ctx.fill()}function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.84)';ctx.beginPath();ctx.arc(x,y,19*s,0,7);ctx.arc(x+23*s,y-12*s,25*s,0,7);ctx.arc(x+48*s,y,19*s,0,7);ctx.arc(x+28*s,y+7*s,21*s,0,7);ctx.fill()}function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,level===10?'#20134f':'#1689ef');g.addColorStop(.55,level===10?'#a33f9d':'#5bd8fa');g.addColorStop(1,level===10?'#ff8b62':'#d2fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);let sunX=760-cam*.08;let glow=ctx.createRadialGradient(sunX,100,8,sunX,100,95);glow.addColorStop(0,'#fffbd0');glow.addColorStop(1,'rgba(255,237,124,0)');ctx.fillStyle=glow;ctx.fillRect(sunX-100,0,200,200);ctx.fillStyle='#fff2a6';ctx.beginPath();ctx.arc(sunX,100,34,0,7);ctx.fill();for(let i=0;i<8;i++){let x=((i*190-cam*.16)%(W+160)+W+160)%(W+160)-60;cloud(x,75+(i%3)*40,.65+(i%2)*.28)}for(let i=0;i<14;i++){let x=((i*105-cam*.27)%(W+150)+W+150)%(W+150)-40;polygon([[x,390],[x+35,240+(i%3)*35],[x+76,390]],level===10?(i%2?'#603e91':'#46306f'):(i%2?'#299f9d':'#37b5a2'));polygon([[x+22,310+(i%3)*35],[x+35,240+(i%3)*35],[x+51,310+(i%3)*35]],level===10?'#8d62b2':'#7ce0c5')}for(let i=0;i<24;i++){let x=((i*71-cam*.12)%(W+30)+W+30)%(W+30);ctx.fillStyle=level===10?'#ffe0a2':'rgba(255,255,255,.7)';ctx.font='16px sans-serif';ctx.fillText(i%2?'✦':'✧',x,145+(i*39)%240)}}
function ground(){for(let p of plats){let x=p.x-cam;if(x+p.w<0||x>W)continue;let g=ctx.createLinearGradient(0,p.y,0,H);g.addColorStop(0,level===10?'#a8434e':'#b86a37');g.addColorStop(1,'#412d55');ctx.fillStyle=g;ctx.fillRect(x,p.y,p.w,H-p.y);ctx.fillStyle=level===10?'#ff6e76':'#47ed72';ctx.fillRect(x,p.y-10,p.w,16);ctx.fillStyle=level===10?'#ffd0a4':'#c8ff80';ctx.fillRect(x,p.y-10,p.w,4);for(let k=8;k<p.w;k+=26){ctx.fillStyle=level===10?'#d95162':'#20bb64';ctx.beginPath();ctx.arc(x+k,p.y-4,7,Math.PI,0);ctx.fill()}for(let k=20;k<p.w;k+=70){ctx.fillStyle='rgba(255,255,255,.13)';ctx.fillRect(x+k,p.y+25,24,4)}}for(let p of pits){let x=p.x-cam;if(x>W||x+p.w<0)continue;ctx.fillStyle='#111a46';ctx.fillRect(x,420,p.w,120);ctx.fillStyle='#24d9f6';ctx.fillRect(x,482,p.w,4);ctx.fillStyle='#ff59b8';ctx.fillRect(x+10,494,Math.max(0,p.w-20),3)}for(let r of ramps){let x=r.x-cam;if(x+r.w<0||x>W)continue;polygon([[x,r.y],[x+r.w,r.y-r.h],[x+r.w,r.y],[x,r.y]],'#ff9b38');polygon([[x+8,r.y-4],[x+r.w-6,r.y-r.h+7],[x+r.w-6,r.y-2],[x+8,r.y+2]],'#ffd85a');ctx.strokeStyle='#fff1a6';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+8,r.y-5);ctx.lineTo(x+r.w-7,r.y-r.h+7);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';ctx.fillText('RAMP',x+25,r.y-16)}}function drawCoins(){for(let c of coinList){if(c.taken)continue;let x=c.x-cam;if(x<-20||x>W+20)continue;ctx.save();ctx.shadowColor='#ffdb39';ctx.shadowBlur=12;ctx.fillStyle='#ffbd20';ctx.beginPath();ctx.ellipse(x,c.y,11,16,0,0,7);ctx.fill();ctx.restore();ctx.strokeStyle='#fff7a3';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff4bb';ctx.fillRect(x-2,c.y-8,4,16)}}function drawEnemyShape(x,y,big=false,hp=1){ctx.save();ctx.translate(x,y);let s=big?1.45:1;ctx.scale(s,s);ctx.shadowColor='#f45dff';ctx.shadowBlur=12;rr(-19,-22,38,31,10,big?'#7c2cd6':'#8a42d0');ctx.shadowBlur=0;polygon([[-16,-20],[-8,-34],[-2,-20],[7,-35],[15,-20]],'#ff71b9');ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-10,6,0,7);ctx.arc(8,-10,6,0,7);ctx.fill();ctx.fillStyle='#16182f';ctx.beginPath();ctx.arc(-6,-10,2.5,0,7);ctx.arc(9,-10,2.5,0,7);ctx.fill();rr(-12,3,24,5,2,'#fff');ctx.fillStyle='#1c2036';ctx.beginPath();ctx.arc(-12,15,7,0,7);ctx.arc(12,15,7,0,7);ctx.fill();if(big){ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText('GUARD',0,-42);ctx.fillStyle='#111';ctx.fillRect(-24,-52,48,5);ctx.fillStyle='#ff405c';ctx.fillRect(-23,-51,46*Math.max(0,hp)/(level>=6?4:3),3)}ctx.restore()}function drawCar(){let c=cars[save.selected]||cars[0],x=car.x-cam,y=car.y;ctx.save();ctx.translate(x+33,y+19);ctx.rotate(Math.max(-.25,Math.min(.25,car.vy*.02)));ctx.translate(-33,-19);if(car.invuln>0&&Math.floor(frame/4)%2===0)ctx.globalAlpha=.45;ctx.shadowColor=c.color;ctx.shadowBlur=14;rr(2,11,63,21,8,c.color);rr(14,1,37,22,8,c.color);ctx.shadowBlur=0;polygon([[19,5],[40,5],[47,17],[17,17]],'#9ef2ff');ctx.fillStyle='#eaffff';ctx.fillRect(22,7,7,3);ctx.fillStyle='#fff7a8';ctx.fillRect(57,17,7,5);ctx.fillStyle='#ffb0a6';ctx.fillRect(3,23,6,5);rr(7,29,49,4,2,'#fff');for(let wx of [14,51]){ctx.fillStyle='#171a2b';ctx.beginPath();ctx.arc(wx,36,12,0,7);ctx.fill();ctx.fillStyle='#c5f6ff';ctx.beginPath();ctx.arc(wx,36,5,0,7);ctx.fill();ctx.strokeStyle='#607c9b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx-4,36);ctx.lineTo(wx+4,36);ctx.moveTo(wx,32);ctx.lineTo(wx,40);ctx.stroke()}if(nitroTime>0){let flick=10+Math.random()*13;polygon([[1,18],[-flick,9],[-24,18],[-flick,26]],'#ff632b');polygon([[0,18],[-flick,14],[-17,19],[-flick,22]],'#fff47b')}ctx.restore()}function drawKeyDoor(){if(keyItem&&!keyItem.taken){let x=keyItem.x-cam;ctx.save();ctx.shadowColor='#fff06b';ctx.shadowBlur=18;ctx.strokeStyle='#ffdf42';ctx.lineWidth=8;ctx.beginPath();ctx.arc(x,keyItem.y,12,0,7);ctx.stroke();ctx.fillStyle='#ffdf42';ctx.fillRect(x+7,keyItem.y-3,22,7);ctx.fillRect(x+22,keyItem.y+1,5,10);ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('KEY',x-13,keyItem.y-23)}if(door&&!door.open){let x=door.x-cam;rr(x-9,305,26,103,7,'#473b80');rr(x-3,313,14,91,4,'#9385d8');ctx.fillStyle='#ffe05a';ctx.beginPath();ctx.arc(x+4,354,5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('LOCKED',x-28,294)}}function drawGun(){if(gunDrop&&!gunDrop.taken){let x=gunDrop.x-cam;ctx.save();ctx.shadowColor='#ff8a40';ctx.shadowBlur=18;rr(x-18,gunDrop.y-9,37,15,4,'#f4f7ff');rr(x+5,gunDrop.y-15,15,9,3,'#ff8b31');rr(x-13,gunDrop.y+5,9,9,2,'#4b5b80');ctx.restore();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText('BLASTER!',x-28,gunDrop.y-23)}}function drawBullets(){for(let b of bullets){let x=b.x-cam;ctx.save();ctx.shadowColor='#ffb442';ctx.shadowBlur=15;rr(x-8,b.y-3,18,7,3,'#ffef7c');ctx.restore()}}function drawBoss(){let b=boss||null;if(!b)return;let x=b.x-cam;ctx.save();ctx.translate(x,0);ctx.shadowColor='#ff4bdb';ctx.shadowBlur=20;for(let wx of [-49,48]){ctx.fillStyle='#111526';ctx.beginPath();ctx.arc(wx,380,27,0,7);ctx.fill();ctx.fillStyle='#c0d9ef';ctx.beginPath();ctx.arc(wx,380,12,0,7);ctx.fill();ctx.strokeStyle='#4d658c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wx-9,380);ctx.lineTo(wx+9,380);ctx.moveTo(wx,371);ctx.lineTo(wx,389);ctx.stroke()}rr(-74,311,148,65,18,'#8d28c6');rr(-54,282,110,49,16,'#c82ee8');this;polygon([[-53,295],[-65,274],[-35,287]],'#ff79bc');polygon([[30,287],[53,269],[49,297]],'#ff79bc');ctx.shadowBlur=0;ctx.fillStyle='#ffe75c';ctx.beginPath();ctx.arc(-26,304,13,0,7);ctx.arc(27,304,13,0,7);ctx.fill();ctx.fillStyle='#241a3c';ctx.beginPath();ctx.arc(-26,304,5,0,7);ctx.arc(27,304,5,0,7);ctx.fill();polygon([[-15,328],[15,328],[8,341],[-8,341]],'#fff');ctx.fillStyle='#ff394e';ctx.fillRect(-68,350,136,8);ctx.restore();ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(625,104,280,23);ctx.fillStyle='#ff3e63';ctx.fillRect(629,108,272*(b.hp/b.maxHp),15);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(625,104,280,23);ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('MONSTER CAR',765,96)}function draw(){bg();ground();drawCoins();enemies.forEach(e=>e.alive&&drawEnemyShape(e.x-cam,e.y,false));if(miniboss&&miniboss.alive)drawEnemyShape(miniboss.x-cam,miniboss.y,true,miniboss.hp);drawKeyDoor();drawGun();drawBullets();if(boss)drawBoss();let fx=worldEnd-cam;if(fx>-20&&fx<W+20){ctx.fillStyle='#fff';ctx.fillRect(fx,238,7,176);for(let y=238;y<270;y+=16)for(let xx=0;xx<32;xx+=16){ctx.fillStyle=((y+xx)%32===0)?'#222':'#fff';ctx.fillRect(fx+7+xx,y,16,16)}}drawCar()}
function loseLife(){if(car.invuln>0)return;lives--;car.invuln=90;car.vx=-2;car.vy=-6;if(lives<=0){scene='gameover';overlay.classList.remove('hidden');panel.innerHTML=`<h1>💥 RACE OVER</h1><p>You ran out of lives on Level ${level}. Your collected coins are safe.</p><button class="action" id="retry">TRY AGAIN</button><button class="action secondary" id="home">HOME</button>`;$('retry').onclick=()=>startLevel(level);$('home').onclick=showHome}hud()}function endLevel(){if(scene==='levelend')return;scene='levelend';overlay.classList.remove('hidden');let bonus=level===10?500:100;save.coins+=bonus;save.unlocked=Math.max(save.unlocked,Math.min(10,level+1));persist();panel.innerHTML=`<h1>${level===10?'🏆 MONSTER CAR DEFEATED!':'🎉 LEVEL CLEAR!'}</h1><p>You collected ${runCoins} coins and earned a ${bonus}-coin finish bonus.</p><p>Wallet: 🪙 <b>${save.coins}</b></p><button class="action" id="next">${level===10?'PLAY AGAIN':'NEXT LEVEL ➜'}</button><button class="action secondary" id="shop2">🚘 SHOP</button><button class="action secondary" id="home">HOME</button>`;$('next').onclick=()=>startLevel(level===10?1:level+1);$('shop2').onclick=showShop;$('home').onclick=showHome;hud()}
function update(){if(scene!=='game'||paused)return;frame++;if(car.invuln>0)car.invuln--;let spec=cars[save.selected]||cars[0],acc=.46;if(keys.left)car.vx-=acc;if(keys.right)car.vx+=acc;if(!keys.left&&!keys.right)car.vx*=.91;if(keys.nitro&&nitroTime<=0&&(!nitroUsed||freeNitro)){nitroTime=95;nitroUsed=true;if(freeNitro)freeNitro=false}if(nitroTime>0){car.vx+=.13*spec.nitro;nitroTime--;car.vx=Math.max(-3.8,Math.min(spec.speed+3,car.vx))}else car.vx=Math.max(-3.8,Math.min(spec.speed,car.vx));if(keys.jump&&car.onGround){car.vy=-11.2;car.onGround=false}if(keys.shoot&&hasGun&&frame%13===0)bullets.push({x:car.x+60,y:car.y+18,vx:10});car.x+=car.vx;car.x=Math.max(0,car.x);car.vy+=.48;car.y+=car.vy;car.onGround=false;let cx=car.x+33,bottom=car.y+car.h;
